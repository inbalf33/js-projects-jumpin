<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>חיפוש סרטים </title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Bootstrap Toast -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
    <!-- Axios -->
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>

    <link rel="stylesheet" href="style.css">
    
    <style>
        .search-wrapper {
            position: relative;
        }
        #clear-search-btn {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }
        #clear-search-btn i {
            font-size: 1.4rem;
            color: #dc3545; /* אדום בולט ויפה */
            transition: color 0.2s;
        }
        #clear-search-btn:hover i {
            color: #b02a37;
        }
    </style>
</head>
<body class="bg-light min-vh-100 d-flex flex-column justify-content-between p-0 m-0">

    <!-- Navbar -->
    <nav class="navbar bg-body-tertiary border-bottom shadow-sm px-3">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1 fw-bold mx-auto fs-4">
                אפליקציית חיפוש סרטים
            </span>            
        </div>
    </nav>

    <main class="container my-4 flex-grow-1">

        <!-- Search Section -->
        <div class="row justify-content-center mb-4">
            <div class="col-md-8 col-lg-6">
                <form id="search-form">
                    <!-- לייבל גדול ובולט -->
                    <label for="search-input" class="form-label fw-bold fs-5 text-dark mb-2 d-block">חיפוש סרט:</label>
                    
                    <div class="d-flex gap-2 align-items-center">
                        <div class="search-wrapper flex-grow-1">
                            <input type="text" id="search-input" class="form-control form-control-lg ps-5" placeholder="הקלד שם של סרט (באנגלית)...">
                            <!-- כפתור X אדום ובולט שמופיע רק כשיש טקסט -->
                            <button type="button" id="clear-search-btn" class="d-none" title="נקה חיפוש">
                                <i class="bi bi-x-circle-fill"></i>
                            </button>
                        </div>
                        <button type="submit" class="btn btn-primary btn-lg px-4">
                            <i class="bi bi-search"></i> חפש
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Filter Section -->
        <div id="filters-container" class="row justify-content-center mb-4 d-none">
            <div class="col-md-8 col-lg-6">
                <div class="card card-body bg-white border-0 shadow-sm p-3">
                    
                    <div class="d-flex justify-content-between align-items-center mb-3 border-bottom pb-2">
                        <span class="fw-bold text-secondary small">תוצאות חיפוש</span>
                        <div class="d-flex align-items-center gap-2">
                            <span id="results-count" class="badge bg-primary rounded-pill px-3 py-2 fs-6">0 תוצאות</span>
                            <button type="button" id="clear-filters-btn" class="btn btn-outline-danger btn-sm" title="איפוס סינונים">
                                <i class="bi bi-x-lg"></i> נקה סינון
                            </button>
                        </div>
                    </div>

                    <div class="row g-3 align-items-center">
                        <div class="col-12 col-sm-7" id="type-selector">
                            <label class="form-label small text-muted mb-1 fw-semibold d-block">סוג תוכן:</label>
                            <div class="btn-group w-100" role="group">
                                <input type="radio" class="btn-check" name="contentType" id="type-movie" value="movie">
                                <label class="btn btn-outline-primary btn-sm" for="type-movie">🍿 סרטים</label>

                                <input type="radio" class="btn-check" name="contentType" id="type-series" value="series">
                                <label class="btn btn-outline-primary btn-sm" for="type-series">📺 סדרות</label>
                            </div>
                        </div>

                        <div class="col-12 col-sm-5">
                            <label for="year-input" class="form-label small text-muted mb-1 fw-semibold d-block">שנה:</label>
                            <input type="number" id="year-input" class="form-control form-control-sm text-start" placeholder="למשל: 2023" min="1900" max="2026">
                        </div>
                    </div>

                </div>
            </div>
        </div>

        <!-- Spinner load -->
        <div id="loader" class="text-center d-none my-5">
            <div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem;">
                <span class="visually-hidden">טוען...</span>
            </div>
            <p class="mt-2 text-muted fw-semibold">מחפש סרטים...</p>
        </div>

        <!-- Error Section -->
        <div id="message-container" class="text-center my-4 d-none"></div>

        <!-- Result Section -->
        <div id="movies-container" class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4"></div>
    </main>   

    <!-- Footer -->
    <footer class="text-center py-2 bg-body-tertiary border-top">
        <small class="text-muted">נוצר על ידי ענבל פיש <span dir="ltr">&copy; 2026</span></small>
    </footer>

    <!-- לוגיקה להצגה/הסתרה של כפתור ה-X בהתאם להקלדה -->
    <script>
        const searchInputEl = document.getElementById('search-input');
        const clearSearchBtn = document.getElementById('clear-search-btn');

        function updateClearButtonVisibility() {
            if (searchInputEl.value.trim() !== '') {
                clearSearchBtn.classList.remove('d-none');
            } else {
                clearSearchBtn.classList.add('d-none');
            }
        }

        // האזנה להקלדה בשדה
        searchInputEl.addEventListener('input', updateClearButtonVisibility);

        // פעולת הלחיצה על כפתור ה-X האדום
        clearSearchBtn.addEventListener('click', function() {
            searchInputEl.value = '';
            updateClearButtonVisibility();
            searchInputEl.focus();
            if (typeof handleInputChange === 'function') {
                handleInputChange();
            }
        });
    </script>

    <script src="script.js"></script>
</body>
</html>
