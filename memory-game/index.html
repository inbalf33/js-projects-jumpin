<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>משחק הזיכרון</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Bootstrap Toast -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
    <link rel="stylesheet" href="style.css">
    
    
</head>
<body class="bg-light min-vh-100 d-flex flex-column justify-content-between p-0 m-0">
    

    <main class="w-100 flex-grow-1 p-0 m-0 d-flex flex-column">

        <!-- Setup Screen -->        
        <div id="setup-screen" class="container my-auto py-5 ">
            <div class="row justify-content-center">
                <div class="col-12 col-md-8 col-lg-6">
                    <div class="card shadow-sm border-0 rounded-4">
                        <div class="card-body p-4 text-center">
                            
                            <h1 class="card-title fw-bold mb-4">משחק הזיכרון 🃏</h1>

                            <form id="setup-form" class="text-start">
                                
                                <!-- Player 1 -->
                                <div class="form-floatingmb-3">
                                    <label for="player1-name" class="form-label fw-semibold">שם שחקן 1 <span class="text-danger">*</span>:</label>
                                    <input type="text" class="form-control" id="player1-name" placeholder="הכנס שם" required>
                                </div>

                                <!-- Player 1 -->
                                <div class="mb-4">
                                    <label for="player2-name" class="form-label fw-semibold">שם שחקן 2 <span class="text-danger">*</span>:</label>
                                    <input type="text" class="form-control" id="player2-name" placeholder="הכנס שם" required>
                                </div>

                                <!-- Difficulty -->
                                <div class="mb-4 text-center">
                                    <label class="form-label d-block fw-semibold mb-3">בחירת רמה:</label>
                                    <div class="btn-group w-100" role="group" aria-label="בחירת רמת קושי">
                                        
                                        <input type="radio" class="btn-check" name="difficulty" id="diff-easy" value="12" checked>
                                        <label class="btn btn-outline-primary py-2" for="diff-easy">
                                            <div class="fw-bold">קל</div>
                                            <small>12 קלפים</small>
                                        </label>

                                        <input type="radio" class="btn-check" name="difficulty" id="diff-medium" value="16">
                                        <label class="btn btn-outline-primary py-2" for="diff-medium">
                                            <div class="fw-bold">בינוני</div>
                                            <small>16 קלפים</small>
                                        </label>

                                        <input type="radio" class="btn-check" name="difficulty" id="diff-hard" value="24">
                                        <label class="btn btn-outline-primary py-2" for="diff-hard">
                                            <div class="fw-bold">קשה</div>
                                            <small>24 קלפים</small>
                                        </label>

                                    </div>
                                </div>

                                <!-- Start Game btn -->
                                <div class="text-center mt-4">
                                    <button type="submit" id="start-btn" class="btn btn-success btn-lg px-5 rounded-pill" disabled>
                                        התחל משחק!
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
            
            
        </div>

        <!-- Game Screen --> 
        <div id="game-screen" class="d-none">
            
            <!-- (Navbar) -->
            <nav class="navbar bg-white border-bottom shadow-sm mb-4 px-3">
                <div class="container-fluid">
                    <!-- Controls btn -->
                    <div class="d-flex gap-2">
                        <button id="reset-btn" class="btn btn-outline-warning btn-sm fw-semibold">איפוס</button>
                        <button id="new-game-btn" class="btn btn-outline-secondary btn-sm">משחק חדש</button>
                    </div>
                                        
                    <span class="navbar-brand mb-0 h1 fw-bold mx-auto fs-4">
                        🃏 משחק הזיכרון
                    </span>
                    
                    <div class="badge bg-light text-dark border p-2 fs-6 rounded-3">
                        ⏱️ טיימר: <span id="timer-display" class="fw-bold text-danger">00:00</span>
                    </div>
                </div>
            </nav>

           
            <div class="container-fluid px-md-4">                
                <!-- Current Turn -->
                <div class="text-center mb-4">
                    <span id="turn-indicator" class="badge bg-primary fs-6 px-4 py-2 shadow-sm"> </span>
                </div>
                
                <div class="row align-items-start g-3">                    
                    <!-- Player 1 Card -->
                    <div class="col-12 col-md-2">
                        <div id="player1-card" class="card border-4 border-primary shadow-sm text-center">
                            <div class="card-body p-2 p-md-3">
                                <h6 id="p1-name-display" class="fw-bold text-primary mb-1 fs-5">שחקן 1</h6>
                                <hr class="my-2">
                                <p class="mb-1 small">ניסיונות: <strong id="p1-attempts">0</strong></p>
                                <p class="mb-1 small">זוגות שנמצאו: <strong id="p1-pairs">0</strong></p>
                                <p class="mb-0 small fw-bold text-warning-emphasis">🏆 ניצחונות: <strong id="p1-wins">0</strong></p>
                            </div>
                        </div>
                    </div>

                    <!-- Board Cards -->
                    <div class="col-12 col-md-8">
                        <div id="game-board" class="row g-2 g-md-3 p-3 bg-white rounded-4 shadow-sm border justify-content-center">
                                <p class="text-muted mb-0 text-center"></p>
                        </div>
                    </div>

                    <!-- Player 1 Card -->
                    <div class="col-12 col-md-2">
                        <div id="player2-card" class="card border-2 shadow-sm text-center">
                            <div class="card-body p-2 p-md-3">
                                <h6 id="p2-name-display" class="fw-bold text-success mb-1 fs-5">שחקן 2</h6>
                                <hr class="my-2">
                                <p class="mb-1 small">ניסיונות: <strong id="p2-attempts">0</strong></p>
                                <p class="mb-1 small">זוגות שנמצאו: <strong id="p2-pairs">0</strong></p>
                                <p class="mb-0 small fw-bold text-warning-emphasis">🏆 ניצחונות: <strong id="p2-wins">0</strong></p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
    
    <!-- Footer -->
    <footer class="text-center py-2 bg-white border-top">
        <small class="text-muted">נוצר על ידי ענבל פיש <span dir="ltr">&copy; 2026</span></small>
    </footer>

    <!-- Toast Container -->
    <div class="toast-container position-fixed top-0 start-50 translate-middle-x p-3" style="z-index: 1100;">
        <div id="reset-toast" class="toast align-items-center text-bg-success border-0 shadow" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body fs-6">
                    🔄 המשחק אופס בהצלחה!
                </div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
        </div>
    </div>

    <!-- Modal End Game -->
    <div class="modal fade" id="winModal" tabindex="-1" data-bs-backdrop="static" data-bs-keyboard="false" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content text-center p-3 rounded-4 shadow">
                <div class="modal-body">
                    <div id="winner-icon" class="display-1 mb-2">🎉</div>
                    <h3 id="winner-title" class="fw-bold text-primary mb-3">כל הכבוד!</h3>
                    <p id="winner-message" class="fs-5 mb-3"></p>
                    
                    <div class="bg-light p-3 rounded-3 mb-4 border">
                        <h6 class="fw-bold mb-2">🏆 מאזן ניצחונות כולל:</h6>
                        <p id="win-tracker-summary" class="mb-0 fs-6 fw-bold"></p>
                    </div>

                    <div class="d-flex justify-content-center gap-2">
                        <button id="rematch-btn" class="btn btn-success px-4 py-2 rounded-3 fw-bold">🔄 סיבוב נוסף</button>
                        <button id="new-game-modal-btn" class="btn btn-outline-secondary px-4 py-2 rounded-3">⚙️ הגדרות חדשות</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
